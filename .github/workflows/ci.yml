name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  differential:
    name: Differential test (interpreter vs Python VM vs C VM)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build native VM
        run: make
      - name: Run differential test
        run: make test
